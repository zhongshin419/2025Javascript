<!DOCTYPE html>
<html lang="zh-TW"> <!-- 改為繁體中文 -->

<head>
    <meta charset="UTF-8"> <!-- 指定編碼為 UTF-8，支援中文 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 響應式設定，讓網頁在手機、平板等裝置上顯示正常 -->

    <title>夢想主題</title> <!-- 頁面標題 -->

    <style>
        /* 網頁整體設定 */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #fff8e1; /* 柔和淺米黃色背景 */
            color: #5d4037; /* 深棕色文字 */
            margin: 0;
            padding: 0;
            text-align: center; /* 文字置中 */
            display: flex;
            align-items: center; /* 垂直置中 */
            height: 100vh; /* 讓頁面佔滿整個視窗高度 */
        }

        /* 主內容區塊樣式 */
        div#myresearch {
            width: 50%; /* 宽度占50% */
            background-color: #fff3e0; /* 溫暖的米橘色 */
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(255, 183, 77, 0.3); /* 橘色系陰影 */
        }

        /* 導覽列連結樣式 */
        a {
            margin: 10px;
            padding: 10px 16px;
            background-color: #ffcc80; /* 橘黃色背景 */
            color: #6d4c41; /* 深棕文字 */
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* 滑鼠懸停效果 */
        a:hover {
            background-color: #ffa726; /* 更亮的橘色 */
            color: white;
        }

        /* 標題樣式 */
        h3 {
            color: #e65100; /* 深橘色標題 */
            text-align: center;
            margin-top: 0;
            padding-top: 20px;
        }

        /* 輸入視窗樣式 */
        label {
            display: block;
            margin: 10px 0 5px;
            text-align: left;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        /* 按鈕樣式 */
        button {
            background-color: #ff9800; /* 橙色背景 */
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #e68900; /* 深橙色 */
        }
    </style>
</head>

<body>
    <h3>我的夢想清單</h3>
    <!-- 導覽列 -->
    <a href="index.html">首頁</a>
    <a href="about.html">關於我</a>
    <a href="dream.html">夢想</a>
    <a href="homework.html">作業</a>

    <!-- 主題內容區塊 -->
    <div id="myresearch">
        <ol>
            <li>目標</li>
            <li>在家中成為一位善良又不雞婆的人</li>
            <li>出國旅遊並探索不同文化</li>
            <li>發表自己的創意作品，做更多藝術創作</li>
            <li>學習多國語言，與世界溝通無礙</li>
            <li>可以去療育別人</li>
            <li>過上平和且有趣的人生</li>
        </ol>
    </div>

    <div style="margin-top: 20px;">
        <ol>
            <li>心得</li>
            <li>在這一個過程，因為自己的懶散都沒有來上課</li>
            <li>但我之後會努力一點的 </li>
            <li>希望能夠在未來的課程中學到更多知識</li>

        </ol>
    </div>

    <footer>
        <p>© 2023 鐘茂軒的個人網頁</p>
</body>

</html>
